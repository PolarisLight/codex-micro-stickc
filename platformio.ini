[platformio]
default_envs = m5stickc

[env:m5stickc]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = m5stick-c
board_build.variant = m5stack_stickc
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  m5stack/M5Unified @ ^0.2.7
  bblanchon/ArduinoJson @ ^6.21.5
  h2zero/NimBLE-Arduino @ 2.5.0
build_src_filter =
  +<CodexMicroBle.cpp>
  +<main_stickc.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -ffile-prefix-map=C:/tmp/codex-stickc-pio321=/pio
