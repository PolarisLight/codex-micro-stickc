<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Codex Micro 双通道本地架构</title>
  <desc id="desc">ChatGPT 使用 BLE HID 传输状态和按键；本地标题同步服务优先使用 USB，并以独立的加密 BLE 特征作为回退。</desc>

