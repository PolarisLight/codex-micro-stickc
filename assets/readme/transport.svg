    <rect x="24" y="152" width="246" height="82" rx="12" fill="#EAF5EE" stroke="#A6D1B6"/>
    <circle cx="48" cy="188" r="7" fill="#27B978"/>
    <text x="68" y="184" fill="#24593C" font-size="21" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">本地 Codex 状态</text>
    <text x="68" y="212" fill="#627269" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Recent / Custom</text>
  </g>

