  <rect x="1" y="1" width="1198" height="498" rx="27" fill="none" stroke="#C9D5CD" stroke-width="2"/>

  <text x="56" y="68" fill="#172019" font-size="42" font-weight="760" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">一台设备，两条独立通道</text>
  <text x="56" y="104" fill="#627269" font-size="21" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">One device, two clean channels · control stays on HID, titles stay out of HID</text>

